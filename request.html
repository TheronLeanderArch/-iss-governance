<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request - ISS Governance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', Arial, sans-serif; background: #0a0a0a; color: #fff; padding: 60px 40px; }
    h1 { font-size: 28px; margin-bottom: 30px; font-weight: 400; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-bottom: 8px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; max-width: 500px; padding: 14px; background: #111; border: 1px solid #222; color: #fff; font-size: 14px; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #444; }
    .btn { display: inline-block; padding: 14px 30px; background: #fff; color: #000; border: none; cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .btn:hover { opacity: 0.9; }
    .note { margin-top: 30px; font-size: 12px; color: #555; }
    .success { background: #1a221a; border: 1px solid #2a3a2a; padding: 20px; margin-bottom: 20px; display: none; }
    .success h2 { color: #6a6; font-size: 16px; margin-bottom: 10px; }
    .success p { color: #666; font-size: 13px; }
  </style>
</head>
<body>

<h1>Request Information</h1>

<div class="success" id="successMessage">
  <h2>Request Submitted</h2>
  <p>Thank you. We review each inquiry and will respond to relevant requests.</p>
</div>

<form id="requestForm">
  <input type="hidden" name="access_key" value="adb20260-37ed-444f-8909-9d46951b1eb2">
  
  <div class="form-group">
    <label>Name *</label>
    <input type="text" name="name" required>
  </div>
  
  <div class="form-group">
    <label>Company *</label>
    <input type="text" name="company" required>
  </div>
  
  <div class="form-group">
    <label>Email *</label>
    <input type="email" name="email" required>
  </div>
  
  <div class="form-group">
    <label>Company Size</label>
    <select name="size">
      <option value="">Select...</option>
      <option value="1-10">1-10</option>
      <option value="10-25">10-25</option>
      <option value="25-50">25-50</option>
      <option value="50-100">50-100</option>
      <option value="100+">100+</option>
    </select>
  </div>
  
  <div class="form-group">
    <label>Your Inquiry *</label>
    <textarea name="message" rows="5" required></textarea>
  </div>
  
  <button type="submit" class="btn">Submit Request</button>
</form>

<p class="note">
  ISS Governance operates on a limited selection basis.<br>
  We review each inquiry and respond to relevant requests.
</p>

<script>
document.getElementById('requestForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  var formData = new FormData(this);
  var key = formData.get('access_key');
  
  fetch('https://web3form.io/submit', {
    method: 'POST',
    body: formData
  })
  .then(response => response.json())
  .then(data => {
    document.getElementById('requestForm').style.display = 'none';
    document.getElementById('successMessage').style.display = 'block';
  })
  .catch(error => {
    alert('Submission failed. Please try again.');
  });
});
</script>

</body>
</html>
